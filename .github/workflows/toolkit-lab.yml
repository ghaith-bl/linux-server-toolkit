name: lint

on:
  push:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every .sh file in the repo.
      - run: shellcheck -f gcc $(find . -name "*.sh")
      # The vault mover and the vault check have no file of their own: they
      # live inside the cloud-init template. yq takes each one out, "test -s"
      # fails the job if nothing came out, then shellcheck reads it like any
      # other script.
      - run: |
          for script in backup-mover vault-verify; do
            yq -r ".write_files[] | select(.path == \"/usr/local/sbin/$script\") | .content" bootstrap/user-data.template > "/tmp/$script"
            test -s "/tmp/$script"
            shellcheck -f gcc "/tmp/$script"
          done
