# example.conf: the settings of one machine built by bootstrap.sh.
#
# The real settings never go into git. Copy this file into the machine's
# folder, closed to everyone else, and fill in your own values there:
#   install -m 600 bootstrap/example.conf ~/lab-images/<name>/<name>.conf
#
# bootstrap.sh reads this file with bash (source):
# write NAME="value", with no spaces around "=".
# The values below are examples only: bootstrap.sh refuses them as they are.

# The machine's name. Its folder is ~/lab-images/<name>/ (mode 700), and its
# disks are /var/lib/libvirt/images/<name>.qcow2 and <name>-data.qcow2.
VM_NAME="backup-example"

# The network card address (MAC). Keep the same one on a rebuild: an address
# reservation on the network follows it. KVM addresses start with 52:54:00.
VM_MAC="52:54:00:00:00:00"

# The only address the admin key may log in from:
# the host's own address on the libvirt network.
ADMIN_FROM="192.168.122.1"

# The only address the push key may send from: the machine that sends backups.
PUSH_FROM="192.168.122.10"

# The admin key's private part. bootstrap.sh reads only the .pub next to it
# (and uses the private part at the end, for the read-only SSH check).
ADMIN_KEY="$HOME/.ssh/backup-example-admin"

# The push key's public part, copied from the sending machine.
PUSH_KEY="$HOME/lab-images/backup-example/backup-example-push.pub"

# The push key's fingerprint, as printed on the sending machine by
# "ssh-keygen -lf <key>.pub". bootstrap.sh compares it with PUSH_KEY.
PUSH_KEY_FP="SHA256:replace-with-the-fingerprint-from-the-sending-machine"

# The data disk:
#   new   = it must not exist; bootstrap.sh makes it.
#   reuse = it must exist; bootstrap.sh keeps it as it is (a rebuild keeps
#           the backups).
DATA_DISK="new"
