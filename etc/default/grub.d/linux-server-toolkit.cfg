# linux-server-toolkit: AppArmor on the kernel's command line (CIS, v2.2).
#
# install.sh copies this file to /etc/default/grub.d/. update-grub reads
# that folder after /etc/default/grub, so the two words are added to what
# is already there. Ubuntu's kernel turns AppArmor on by itself: this
# writes it down, so a change to the default cannot switch it off unseen.
# The reasons are in docs/NOTES.md (v2.2).
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX apparmor=1 security=apparmor"
