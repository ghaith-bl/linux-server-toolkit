# linux-server-toolkit: kernel modules this lab never loads (CIS, v2.2).
#
# install.sh copies this file to /etc/modprobe.d/. For each module, two
# lines: "install" makes every load end in /bin/false, and "blacklist"
# stops the kernel from loading it by itself when a device shows up.
# The reasons are in docs/NOTES.md (v2.2).

# File systems of old or other operating systems.
install cramfs /bin/false
blacklist cramfs
install freevxfs /bin/false
blacklist freevxfs
install hfs /bin/false
blacklist hfs
install hfsplus /bin/false
blacklist hfsplus
install jffs2 /bin/false
blacklist jffs2

# USB disks and sticks: a virtual machine has none.
install usb-storage /bin/false
blacklist usb-storage
