# linux-server-toolkit: the SSH server's settings (CIS, v2.2).
#
# install.sh copies this file to /etc/ssh/sshd_config.d/. sshd keeps the
# first value it reads for a setting, and reads that folder in name order:
# this name sorts before the other files there, so these values win.
# The reasons are in docs/NOTES.md (v2.2).

# Who may log in over SSH, by name: nobody else, whatever key they hold.
# ghaith is the admin on both machines. backup-recv exists on backup-lab
# only, where it receives the backups.
AllowUsers ghaith backup-recv

# No direct root login: admin work goes through ghaith and sudo.
PermitRootLogin no
# An account with an empty password cannot log in.
PermitEmptyPasswords no
# No login that trusts the name of the client's machine.
HostbasedAuthentication no
IgnoreRhosts yes
# A user's key file cannot set environment variables for the session.
PermitUserEnvironment no

# One connection gets 60 seconds to log in, 4 tries, and 10 sessions.
LoginGraceTime 60
MaxAuthTries 4
MaxSessions 10
# Connections that have not logged in yet: from 10 on, 30% of the new ones
# are refused; at 60, all of them.
MaxStartups 10:30:60
# A client that stops answering is dropped after 3 checks, 15 seconds apart.
ClientAliveInterval 15
ClientAliveCountMax 3

# Logins and failures go to the log (/var/log/auth.log).
LogLevel INFO

# The algorithms the benchmark accepts. Ciphers and KexAlgorithms are the
# defaults of OpenSSH 9.6, written down; MACs leaves out the SHA-1 and umac
# ones.
Ciphers chacha20-poly1305@openssh.com,aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
