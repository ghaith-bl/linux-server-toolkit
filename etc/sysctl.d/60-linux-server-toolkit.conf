# linux-server-toolkit: kernel settings (CIS, v2.2).
#
# install.sh copies this file to /etc/sysctl.d/. The kernel reads that
# folder at every start, in name order: this name sorts after Ubuntu's own
# files (10-*.conf). The reasons are in docs/NOTES.md (v2.2).

# This machine is not a router: it passes no packet on for another machine,
# and tells no machine to use another route.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.forwarding = 0

# A packet cannot choose its own route through this machine.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Another machine cannot change this machine's routes: not with a redirect
# message, even one from the gateway, and not with an IPv6 router
# advertisement.
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Under a flood of connection requests, the machine keeps answering.
net.ipv4.tcp_syncookies = 1

# A program that runs with another user's rights writes no memory dump.
fs.suid_dumpable = 0
# Each program gets its memory at addresses that change at every start.
kernel.randomize_va_space = 2
