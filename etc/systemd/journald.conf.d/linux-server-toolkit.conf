# linux-server-toolkit: the journal also feeds rsyslog (CIS, v2.2).
#
# install.sh copies this file to /etc/systemd/journald.conf.d/. rsyslog
# writes /var/log/auth.log, which log-analyzer.sh reads, from what the
# journal passes on: the lab depends on it, so it is written down here.
# The reasons are in docs/NOTES.md (v2.2).
[Journal]
ForwardToSyslog=yes
