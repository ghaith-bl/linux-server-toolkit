# linux-server-toolkit: where the clock comes from (CIS, v2.2).
#
# install.sh copies this file to /etc/systemd/timesyncd.conf.d/. The time
# servers are named here, not left to what the network offers: the
# backups' retention counts days on these clocks.
# The reasons are in docs/NOTES.md (v2.2).
[Time]
NTP=0.ubuntu.pool.ntp.org 1.ubuntu.pool.ntp.org
FallbackNTP=2.ubuntu.pool.ntp.org 3.ubuntu.pool.ntp.org
